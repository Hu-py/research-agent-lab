name: Live Research Agent Lab (manual)

on:
  workflow_dispatch:
    inputs:
      evidence_source:
        description: "Public generic demo, or approved profile in RESEARCH_SNAPSHOT_JSON"
        required: true
        type: choice
        options:
          - public_demo
          - approved_secret
          - team_evidence
          - workbench_sync
        default: public_demo
      max_generations:
        description: "0 = cheapest initial paid test; 1 = one evolution generation"
        required: true
        type: choice
        options: ["0", "1"]
        default: "0"
      max_papers:
        description: "Maximum real OpenAlex papers to screen"
        required: true
        type: choice
        options: ["4", "6", "8"]
        default: "6"
      max_pairs:
        description: "Pairwise competitors per tournament, judged in both orders"
        required: true
        type: choice
        options: ["1", "2", "3"]
        default: "2"
      save_supabase:
        description: "Write results into isolated lab_frontier_runs table"
        required: true
        type: boolean
        default: true
      save_knowledge_graph:
        description: "Write knowledge graph (team_evidence ONLY; requires SQL 004)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: research-frontier-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    name: Bounded live multi-agent research
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
      ENFORCE_LANGFUSE_AUTH: "true"
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEARCH_SNAPSHOT_JSON: ${{ secrets.RESEARCH_SNAPSHOT_JSON }}
      TEAM_EVIDENCE_JSON: ${{ secrets.TEAM_EVIDENCE_JSON }}
      WORKBENCH_API_URL: ${{ vars.WORKBENCH_API_URL }}
      WORKBENCH_EXPORT_TOKEN: ${{ secrets.WORKBENCH_EXPORT_TOKEN }}
      EVIDENCE_SOURCE: ${{ inputs.evidence_source }}
      MAX_GENERATIONS_INPUT: ${{ inputs.max_generations }}
      MAX_PAPERS_INPUT: ${{ inputs.max_papers }}
      MAX_PAIRS_INPUT: ${{ inputs.max_pairs }}
      SAVE_SUPABASE: ${{ inputs.save_supabase }}
      SAVE_KNOWLEDGE_GRAPH: ${{ inputs.save_knowledge_graph }}
      MAX_MODEL_CALLS: "30"
      MAX_RESERVED_TOKENS: "350000"
    steps:
      - name: Checkout vetted main branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install orchestration and tracing libraries
        run: python -m pip install -e '.[observability]'
      - name: Run credential preflight and bounded real graph
        run: python -m research_agent_lab.frontier.cloud_runner
      - name: Upload public-demo-only research artifact
        if: ${{ success() && inputs.evidence_source == 'public_demo' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-frontier-public-report
          path: outputs/live-frontier-public.json
          retention-days: 7
          if-no-files-found: error

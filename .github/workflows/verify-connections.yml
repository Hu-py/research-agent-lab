name: Verify Research Lab Connections (no AI calls)

on:
  workflow_dispatch:
    inputs:
      check_workbench:
        description: "Also check authorized original Workbench metadata endpoint"
        type: boolean
        required: true
        default: true
      check_langfuse:
        description: "Validate Langfuse keys/region without AI calls"
        type: boolean
        required: true
        default: true
      check_approved_catalog:
        description: "Validate explicitly approved private CUSP metadata Secret (no model calls)"
        type: boolean
        required: true
        default: false
      check_frontier_live_events:
        description: "Read-only check of SQL 007 stage-event table (no AI calls)"
        type: boolean
        required: true
        default: false
      check_llm_replay_cache:
        description: "Check optional SQL 006 model response replay table and key (read only)"
        type: boolean
        required: true
        default: false
      emit_langfuse_smoke_trace:
        description: "Send one synthetic Langfuse trace (no DeepSeek, no research content)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Read-only Supabase and Workbench preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKBENCH_API_URL: ${{ vars.WORKBENCH_API_URL }}
      WORKBENCH_EXPORT_TOKEN: ${{ secrets.WORKBENCH_EXPORT_TOKEN }}
      CHECK_WORKBENCH: ${{ inputs.check_workbench }}
      CHECK_APPROVED_CATALOG: ${{ inputs.check_approved_catalog }}
      CHECK_LLM_REPLAY_CACHE: ${{ inputs.check_llm_replay_cache }}
      CHECK_FRONTIER_LIVE_EVENTS: ${{ inputs.check_frontier_live_events }}
      TEAM_DATA_CATALOG_JSON: ${{ secrets.TEAM_DATA_CATALOG_JSON }}
      CHECK_LANGFUSE: ${{ inputs.check_langfuse }}
      EMIT_LANGFUSE_SMOKE_TRACE: ${{ inputs.emit_langfuse_smoke_trace }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install read-only preflight dependencies
        run: python -m pip install -e '.[observability]'
      - name: Check connectivity without any paid model calls
        run: python -m research_agent_lab.frontier.preflight_cli

name: Compare Two Frontier Experiments (no AI calls)

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: "Supabase lab_frontier_runs UUID of initial baseline (generation 0)"
        required: true
        type: string
      treatment_run_id:
        description: "Supabase lab_frontier_runs UUID of multi-round treatment"
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Read-only evidence alignment and research outcome audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Compare saved run metadata without DeepSeek or uploads
        env:
          BASE_ID: ${{ inputs.baseline_run_id }}
          TREAT_ID: ${{ inputs.treatment_run_id }}
        run: |
          python -m research_agent_lab.frontier.compare_cli \
            --baseline-id "$BASE_ID" --treatment-id "$TREAT_ID" \
            --out "$RUNNER_TEMP/private-ab-audit.json"
      - name: Show safe numerical A/B summary
        env:
          REPORT_PATH: ${{ runner.temp }}/private-ab-audit.json
        run: |
          python - <<'PY'
          import json, os
          p = json.load(open(os.environ["REPORT_PATH"], encoding="utf-8"))
          assert p["analysis_kind"] == "descriptive_pairwise_audit_not_causal_effect"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Research Lab A/B descriptive audit\n\n")
              f.write("**Comparability:** "+p["comparability"]+"\n\n")
              if p["blocking_reasons"]:
                  f.write("Blocking evidence differences: "+", ".join(p["blocking_reasons"])+"\n\n")
              f.write("| Metric | Baseline | Treatment |\n|---|---:|---:|\n")
              for key in ("generation_count","candidate_versions","tournament_matches",
                          "retained_papers","position_disagreements","provider_calls",
                          "replay_cache_hits"):
                  f.write(f"| {key} | {p['baseline'][key]} | {p['treatment'][key]} |\n")
              f.write("\nElo not comparable across runs. No external scientific "
                      "validation or blinded human review performed.\n")
          PY
